[project]
name = "macromax"
dynamic = ["version"]
description = "Library for solving macroscopic Maxwell's equations for electromagnetic waves in gain-free heterogeneous (bi-)(an)isotropic (non)magnetic materials. This is of particular interest to calculate the light field within complex, scattering, tissues."
readme = "README.md"
license = "MIT"
requires-python = ">= 3.13"
authors = [
    {name = "Tom Vettenburg", email = "t.vettenburg@dundee.ac.uk"},
]
keywords = ["Maxwell", "electromagnetic", "light", "scattering", "heterogeneous", "anisotropy", "chiral", "magnetic",
    "propagation", "optics",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
    "coloredlogs>=15.0.1",
    "numpy>=2.5.1",
    "scipy>=1.18.0",
]

[project.optional-dependencies]
torch = [
    "torch>=2.13.0",
]

[project.urls]
Homepage = "https://github.com/corilim/MacroMax/tree/master/python"
Documentation = "https://macromax.readthedocs.io/"
Repository = "https://github.com/corilim/MacroMax/"
Issues = "https://github.com/tttom/MacroMax/issues"
Changelog = "https://github.com/corilim/MacroMax/blob/master/python/CHANGES.md"

[dependency-groups]
dev = [
    {include-group = "test"},
    {include-group = "check"},
    {include-group = "profile"},
]
test = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "pytest-randomly>=4.1.0",
    {include-group = "coverage"},
]
coverage = ["coverage>=7.15.0"]
check = [
    "pre-commit>=4.6.0",
    "ruff>=0.16.2",
    "ty>=0.0.55",
]
profile = [
    "pprofile>=2.2.0",
    "tensorboard>=2.21.0",
]
docs = [
    "added_value>=0.24.0",
    "m2r2>=0.3.4",
    "mkdocs-material >= 9.7.6",
    "mkdocstrings-python >= 2.0.5",
    "mkdocs-jupyter>=0.17.3",
    "recommonmark>=0.7.1",
    "sphinx-autodoc-typehints>=3.12.1",
    "sphinx_rtd_theme>=3.1.0",
    "sphinxcontrib.mermaid>=2.0.2",
    "tomli>=2.4.1",
]
examples = [
    "matplotlib>=3.11.1",
    "pint>=0.25.3",
    "scikit-image>=0.26.0",
]

[build-system]
requires = ["hatchling", "uv-dynamic-versioning"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "uv-dynamic-versioning"

[tool.hatch.build.targets.sdist]
include = [
    "/macromax",
]

[tool.pip]
only-binary = [":all:"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py313"
line-length = 120
indent-width = 4

[tool.ruff.format]
docstring-code-format = true
docstring-code-line-length = "dynamic"
indent-style = "space"
quote-style = "single"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B", "I", "UP"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ty.environment]
root = ["./src", "."]

[[tool.ty.overrides]]
include = ["src/**", "**"]

[tool.ty.overrides.rules]
"possibly-unresolved-reference" = "error"

[tool.ty.rules]
all = "warn"

[tool.ty.terminal]
"error-on-warning" = false
"output-format" = "full"

[tool.uv]
default-groups = ["dev", "docs", "examples"]
exclude-newer = "7 days"
